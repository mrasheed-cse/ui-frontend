<div class="row">

    <div class="col-md-12">
      
      <div class="card" style="border:0px !important;background:transparent !important">
      </div>
      <div class="card">
      <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
      <div class="card-header"  >
            <i class="fa fa-align-justify"></i>Search Voucher History
          </div>
          <div class="card-body" *ngIf="!dataFound">
            <div class="row mt-5 form-inline ">
                <div class="form-group mx-sm-3">
                    <input type="text" placeholder="Batch Number ..." [(ngModel)]="BatchNumber" class="form-control" autocomplete="off">
                     <button type="submit"  (click) ="search()" class="btn btn-sm btn-primary float-right" >
						<i class="fa fa-dot-circle-o"></i> Find Batch Details</button>
                </div>
                
                
                </div>
                
                </div>
                
                <div class="card-body" *ngIf="dataFound">
                
                
                <form [formGroup] novalidate >
		<div class="card-body">
					<div class="row">
											
						<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label">Batch Number</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{BatchNumber}}">
									</div>
	
	
								</div>
						</div>
						<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label">Denomination</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{denomination}}">
									</div>
	
	
								</div>
										</div>
					</div>		
									
					<div class="row">
					
						<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label">Start Serial.</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{startSerial}}">
									</div>
	
	
								
								</div>
						</div>
						
						<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label">End Serial</label>
									<div class="col-md-7">
									<input disabled type="text" class="form-control calendar-container"
									value="{{endSerial}}">
								</div>
								</div>
						</div>
						
						
					</div>
					
					<div class="row">
						<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label">Batch Quantity</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{quantity}}">
									</div>
								</div>
						</div>
						<div class="col-md-6">
						
										<div class="form-group row">
											<label class="col-md-5 col-form-label" for="requestDate">Vendor</label>
											<div class="col-md-7">									
												<input disabled type="text" class="form-control calendar-container"
									value="vendor">
									</div>
											</div>
										</div>
			
									</div>
						
					</div>		
					<div class="row">
						
								
									<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label">HRN Generation Date</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{hrnDate}}">
									</div>
									</div>
								</div>
								
								<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label">Data Send To Vendor</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{dataSendToVendor}}">
									</div>
									</div>
								</div>
										</div>
										
						
					<div class="row">
						
								
									<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label" >Request For Activation(SSM)</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{requestActivation}}">
									</div>
								</div>
						</div>
						
						<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" for="voucherserialdigits">Confirmation From Tech</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{confirmationTech}}">
									</div>
								</div>
										</div>
									
						</div>
						<div class="row">
						
								
										
									<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" for="voucherserialdigits">Confirmation To Log</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{confirmationLog}}">
									</div>
								</div>
										</div>
										<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" for="voucherserialdigits">PO</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{po}}">
									</div>
	
	
								</div>
										</div>
						</div>
						
							<div class="row">
						
								
										
									<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" for="voucherserialdigits">Printed Expiry Date</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{printedExpiryDate}}">
									</div>
								</div>
										</div>
										<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" for="voucherserialdigits">Network Expiry Date</label>
									<div class="col-md-7">
										<input disabled type="text" class="form-control calendar-container"
									value="{{nwExpiryDate}}">
									</div>
	
	
								</div>
										</div>
						</div>
					<div class="card-footer text-right">
					<button  class="btn btn-sm btn-dark" (click)="back()">
						<i class="fa fa-dot-circle-o"></i> back</button>
					</div>
					</form>
                
                </div>
                
                
                
                
                
                
                
                
                
                </div>
                </div>
                </div>
