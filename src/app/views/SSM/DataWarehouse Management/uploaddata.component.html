 <div class="row">
	<div class="col-md-1">
		 
	</div>
	<div class="col-md-10">
		<div class="card">
		<div class="card-header">
            <i class="fa fa-align-justify"></i> Data Warehouse Upload
          </div>
          <div class="card-body">
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Upload For</label>
									<div class="col-md-7">
										<select class="form-control" id="ItemCode" [(ngModel)]="uploadFor" >
											<option [value]="0">AUC</option>
											<option [value]="1">ADC</option>
										</select>
									</div>
	
	
								</div>
										</div>
							<div class="col-md-6">
                     
                  <div class="form-group row">
								<label class="col-md-5 col-form-label">Upload File:</label>
                <a  onclick="document.getElementById('getFile').click()">Browse ...</a>
                <input #fileInput type='file' id="getFile" (click)="fileInput.value = null" accept=".csv" style="position: fixed; left: -200px; top: -200px;" (change)="handleFileInput($event.target.files)">
	
								</div>
								</div>
								
								
										
					</div>	
					
					</div>
					   <div class="card-footer">
          
                 <button   class="btn btn-sm btn-primary" (click)="submit()">Submit</button>
                 </div>
					
					</div>
					
					</div>
					
					</div>
