 <div class="row">
	<div class="col-md-1">
		 
	</div>
	<div class="col-md-10">
		<div class="card">
		 <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
		<div class="card-header">
            <i class="fa fa-align-justify"></i> Data Warehouse Upload
          </div>
          <div class="card-body">
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Upload For</label>
									<div class="col-md-7">
										<select class="form-control" id="ItemCode" [(ngModel)]="uploadFor" >
											<option [value]="0">AUC</option>
											<option [value]="1">ADC</option>
										</select>
									</div>
	
	
								</div>
										</div>
							<div class="col-md-6">
                     
                  <div class="form-group row">
								<label class="col-md-5 col-form-label">Upload File:</label>
                			
                <input #fileInput type='file' id="getFile" (click)="fileInput.value = null" (change)="handleFileInput($event.target.files)">
	 
								</div>
								</div>	
					</div>
					<div class="row">
					<div classs="col-md-12">

							<a href="assets/file/SampleADC.ADC" download>Download ADC sample file</a><br/>
							<a href="assets/file/SampleAUC.AUC" download>Download AUC sample file</a>
							
			
						  </div>
						</div>
					</div>
					   <div class="card-footer">
          
                 <button   class="btn btn-sm btn-primary" (click)="submit()">Submit</button>
                 </div>
					
					</div>
					
					</div>
					
					</div>
