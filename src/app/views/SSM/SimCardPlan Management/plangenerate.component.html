 <div class="row">
	<div class="col-md-1">
		 
	</div>
	<div class="col-md-10">
		<div class="card">
		 <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
		<div class="card-header">
            <i class="fa fa-align-justify"></i>  Plan Generation
          </div>
		<form [formGroup]="planGenrationForm" novalidate (ngSubmit)="SubmitForPlanGenerationFromMsisdnFile()" >
		<div class="card-body">
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Item Code</label>
									<div class="col-md-7">
										<select class="form-control" id="ItemCode" formControlName="ItemCode" required >
											<option></option>
											<option *ngFor="let aSimType of listitemDropDown" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
										</select>
									</div>
	
	
								</div>
										</div>
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Product Name</label>
									<div class="col-md-7">
										<select class="form-control" id="ProductName" formControlName="ProductName" required  >
											<option></option>
											<option *ngFor="let aSimType of listDropDownProductName" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
										</select>
									</div>
	
	
								</div>
										</div>
								
								
										
					</div>	
					
					<div class="row">
					
					<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Customer Category</label>
									<div class="col-md-7">
										<select class="form-control" id="CustomerCategory" formControlName="CustomerCategory" required >
											<option [value]="0">CORPORATE</option>
											<option [value]="1">REGULAR</option>
										<option [value]="2">UNPAIR</option>
										<option [value]="3">Replacement </option>
										</select>
									</div>
	
	
								</div>
										</div>
										
					<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >ProductCode</label>
									<div class="col-md-7">
										<select class="form-control" id="ProductCode" formControlName="ProductCode" required >
											<option></option>
											<option *ngFor="let aSimType of listDropDownProductCode" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
										</select>
									</div>
	
	
								</div>
										</div>
										</div>
						<div class="row">
						
						<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Category Name</label>
									<div class="col-md-7">
										<select class="form-control" id="catName" formControlName="CategoryName" required >
											<option></option>
											<option *ngFor="let aSimType of listCategoryName" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
										</select>
									</div>
	
	
								</div>
										</div>
										<div class="col-md-6">
												<div class="form-group row">
								<label class="col-md-5 col-form-label" >Quantity</label>
									<div class="col-md-7">
									<input disabled type="text" class="form-control" 
								value="{{quantity}}"> 
		</div>

							</div>
									</div>	
						</div>	
						<div class="row">
								<div class="col-md-6">
														<div class="form-group row">
										<label class="col-md-5 col-form-label" >Name who share plan </label>
										<div class="col-md-7">
											<select class="form-control" id="SharerName" formControlName="SharerName" required >
												<option></option>
												<option *ngFor="let aSimType of listDropDownSharerName" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
											</select>
										</div>
		
		
									</div>
											</div>
									<div class="col-md-6">
														<div class="form-group row">
										<label class="col-md-5 col-form-label" >Plan Circle </label>
										<div class="col-md-7">
											<select class="form-control" id="PlanCircle" formControlName="PlanCircle" required >
												<option></option>
												<option *ngFor="let aSimType of listDropDownPlanCircle" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
											</select>
										</div>
		
		
									</div>
											</div>			
											
											
						</div>		
				<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Requester </label>
									<div class="col-md-7">
										<select class="form-control" id="Requester" formControlName="Requester" required >
											<option></option>
											<option *ngFor="let aSimType of listDropDownRequester" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
										</select>
									</div>
	
	
								</div>
										</div>
								<div class="col-md-6">
								<div class="form-group row">
									<label class="col-md-5 col-form-label">WR#.</label>
									<div class="col-md-7">
										<input type="text" id="wrname" name="wrname" class="form-control" autocomplete="off"  formControlName="wrname"  required
											 >
									</div>
								</div>
						</div>		
										
										
					</div>		
					
					
					<div class="row">
							
										
							
							<div class="col-md-6">
												<div class="form-group row">
							<label class="col-md-5 col-form-label">MSISDN:</label>
			<a  onclick="document.getElementById('getFile').click()" class="btn btn-primary">Browse ...</a>
			<input #fileInput type='file' id="getFile"  (click)="fileInput.value = null" accept=".csv" style="position: fixed; left: -200px; top: -200px;" (change)="handleFileInput($event.target.files)" required>
									</div>
									</div>	
									
										
									
									
				</div>			
					
            </div>
            
            	<div class="card-footer text-right">
					<button type="submit" [disabled]="!planGenrationForm.valid  && !isDisableBtn"  class="btn btn-sm btn-primary">
						<i class="fa fa-dot-circle-o"></i> Submit</button>
					</div>
            </form>					
					
					
					
					
					
					
					
					</div>
					</div>
					</div>
