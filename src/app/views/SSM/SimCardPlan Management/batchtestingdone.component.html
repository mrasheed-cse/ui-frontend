 <div class="row">
	<div class="col-md-1">
		 
	</div>
	<div class="col-md-10">
		<div class="card">
		 <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
		<div class="card-header" *ngIf="isConfig">
            <i class="fa fa-align-justify"></i> Batch Testing Complete List
          </div>
           <div class="card-body" *ngIf="isConfig">
           <table class="table table-bordered table-striped table-sm">
                <thead>
                  <tr>
                    <th>WR Number</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Creator Name</th>
                    <th>Printing Date</th>
                    <th> Packaging Date</th>
                    <th>Delivery Date</th> 
                    <th>DownLoad</th>
                  </tr>
                </thead>
                <tbody *ngFor="let aTask of listPlangenerateData">
                            <tr>
                                <td>{{aTask.wrnumber}}</td>
                                <td>{{aTask.productname}}</td>
                                 <td>{{aTask.quantity}}</td>
                                <td>{{aTask.creatorname}}</td>
                                 <td>{{aTask.printingdate}}</td>
                                 <td>{{aTask.packagingdate}}</td>
                                   <td>{{aTask.deliverydate}}</td>
                                
                                <td> DownLoad </td>
                            </tr>
                </tbody>
              </table>
           
           
           </div>
            
         
          
          
          
           </div>
