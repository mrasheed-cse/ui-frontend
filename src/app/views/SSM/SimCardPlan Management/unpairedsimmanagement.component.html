<div class="recycle" >
 <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
    <h5>Unpaired Sim Management </h5>
    <div class="dnd-bar" >
        <p style="color: #990000; margin-left: 10px; font-weight: bold;" *ngIf="fileerror">{{fileuploadstatus}}</p>
        <p style="color: #005500; margin-left: 10px; font-weight: bold;" *ngIf="filesuccess">{{fileuploadstatus}}</p>
    </div>
    <p style="font-size: 20px; font-family: sans-serif;"></p>
    <div class="recycle-bar"></div>
    <div id="recycle-download" class="recycle-download" style="border-radius: 10px 10px 0 0">
        <i class="fa fa-chevron-circle-right" aria-expanded="true" aria-controls="collapseOne" style="font-size:20px; color:#1b91c1; margin-left: 2px" aria-hidden="true"></i>
        Upload  File
        <div id="collapseOne" style="background-color: white;" aria-labelledby="headingOne" data-parent="#recycle-download">
            <div class="card-body">
                    <div class="row">
							<div class="col-md-6">
													<div class="form-group row">
                <sub>Please Select the File:</sub>
                                <input #fileInput type='file' id="getFile" (click)="fileInput.value = null" (change)="handleFileInput($event.target.files)">

            </div>
        </div>
        <div classs="col-md-6">

                <a href="assets/file/SampleUnpairSim.csv" download>Download sample file</a>

              </div>
    </div>
                <button *ngIf="fileName && !uploading" type="button" class="btn btn-info btn-sm" style="border-radius: 10px; color: white" (click)="dndUpload()">
                    Click Here To Upload <span style="color: yellow; text-decoration: underline;">{{fileName}}</span>
                </button>
            </div>
        </div>
    </div>
</div>
