
    <div class="row">
            <div class="col-md-1">
                 
            </div>
            <div class="col-md-10">
                <div class="card">
                 <div class="div_cust_loading_sign" *ngIf="isLoading"> 
                     <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                         <div style="width:25%;height:25%;margin:0px auto;margin-top:20%">
                         <i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i>
                        </div></div> </div>
           
                <div class="card-header">
                    <i class="fa fa-align-justify"></i> Unpaired Sim Management
                  </div>
                  <div class="dnd-bar" >
                        <p style="color: #990000; margin-left: 10px; font-weight: bold;" *ngIf="fileerror">{{fileuploadstatus}}</p>
                        <p style="color: #005500; margin-left: 10px; font-weight: bold;" *ngIf="filesuccess">{{fileuploadstatus}}</p>
                    </div>
                <form [formGroup]="unpairedPlanGenrationForm" novalidate (ngSubmit)="SubmitForPlanGenerationFromUnPairedMsisdnFile()" >
                <div class="card-body">
                            <div class="row">
                                    <div class="col-md-6">
                                                            <div class="form-group row">
                                            <label class="col-md-5 col-form-label" >Item Code</label>
                                            <div class="col-md-7">
                                                <select class="form-control" id="ItemCode" formControlName="ItemCode" required >
                                                    <option></option>
                                                    <option *ngFor="let aSimType of listitemDropDown" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
                                                </select>
                                            </div>
            
            
                                        </div>
                                                </div>
                                    <div class="col-md-6">
                                                            <div class="form-group row">
                                            <label class="col-md-5 col-form-label" >Product Name</label>
                                            <div class="col-md-7">
                                                <select class="form-control" id="ProductName" formControlName="ProductName" required  >
                                                    <option></option>
                                                    <option *ngFor="let aSimType of listDropDownProductName" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
                                                </select>
                                            </div>
            
            
                                        </div>
                                                </div>
                                        
                                        
                                                
                            </div>	
                            
                            <div class="row">
                            
                            <div class="col-md-6">
                                                          
                                                
                                                            <div class="form-group row">
                                            <label class="col-md-5 col-form-label" >ProductCode</label>
                                            <div class="col-md-7">
                                                <select class="form-control" id="ProductCode" formControlName="ProductCode" required >
                                                    <option></option>
                                                    <option *ngFor="let aSimType of listDropDownProductCode" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
                                                </select>
                                            </div>
            
            
                                        </div>
                                                </div>
                                                
                                
                                    <div class="col-md-6">
                                                            <div class="form-group row">
                                            <label class="col-md-5 col-form-label" >Requester </label>
                                            <div class="col-md-7">
                                                <select class="form-control" id="Requester" formControlName="Requester" required >
                                                    <option></option>
                                                    <option *ngFor="let aSimType of listDropDownRequester" [value]="aSimType.groupName">{{aSimType.groupName}}</option>
                                                </select>
                                            </div>
            
            
                                        </div>
                                                </div>
                                            </div>		
                            
                            
                                            <div class="row">
                                        <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-md-5 col-form-label">WR#.</label>
                                            <div class="col-md-7">
                                                <input type="text" id="wrname" name="wrname" class="form-control" autocomplete="off"  formControlName="wrname"  required
                                                     >
                                            </div>
                                        </div>
                                </div>		
                                                
                                                     
                           
                                    <div class="col-md-6">
                                        <div class="form-group row">
                                            <label class="col-md-5 col-form-label" for="getFile">Msisdn File</label>
                                            <div class="col-md-7">
                                            <input #fileInput type='file' id="getFile"  (click)="fileInput.value = null" accept=".csv" (change)="handleFileInput($event.target.files)" required>
                                            </div>
                                        </div>
                                    </div>
                             </div>
                             <div class="form-group row">
                                    <a href="assets/file/SampleUnpairSim.csv" download>Download sample file</a>
                            </div>
                        </div>
                       
                        <div class="card-footer text-right">
                            <button type="submit" [disabled]="!unpairedPlanGenrationForm.valid"  class="btn btn-sm btn-primary">
                                <i class="fa fa-dot-circle-o"></i> Submit</button>
                            </div>
                    </form>					
                    
                            </div>
                            </div>
</div>
