 <div class="row">
	<div class="col-md-1">
		 
	</div>
	<div class="col-md-10">
		<div class="card">
		 <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
   
		<div class="card-header" *ngIf="isConfig">
            <i class="fa fa-align-justify"></i> Batch Testing 
          </div>
           <div class="card-body" *ngIf="isConfig">
           <table class="table table-bordered table-striped table-sm">
                <thead>
                  <tr>
                    <th>WR Number</th>
                      <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Creator Name</th>
                    <th>Printing Date</th>
                    <th> Packaging Date</th>
                    <th>Delivery Date</th> 
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody *ngFor="let aTask of listPlangenerateData">
                            <tr>
                                <td>{{aTask.wrnumber}}</td>
                                <td>{{aTask.productname}}</td>
                                 <td>{{aTask.quantity}}</td>
                                <td>{{aTask.creatorname}}</td>
                                  <td>{{aTask.printingdate}}</td>
                                 <td>{{aTask.packagingdate}}</td>
                                   <td>{{aTask.deliverydate}}</td>
                                
                                <td> <a  href="#" (click)="details(aTask.id);$event.preventDefault();" role="button">Details</a> </td>
                            </tr>
                </tbody>
              </table>
           
           
           </div>
            
          <div class="card-body" *ngIf="isProceed">
            <form [formGroup]="batchTesting" novalidate (ngSubmit)="submit()" >
		<div class="card-body">
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Test For (Number Series)</label>
									<div class="col-md-7">
										
									 <select class="form-control" id="testFor" formControlName="testFor" required >
											<option [value]="017">017</option>
												<option [value]="013">013</option>
												</select>

									</div>
	
	
								</div>
										</div>
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >MSISDN Type</label>
									<div class="col-md-7">
										<select class="form-control" id="msisdntype" formControlName="msisdnType" required >
										<option [value]="0">Recycle MSISDN</option>
											<option [value]="1">New MSISDN</option>
												<option [value]="2">Virtual MSISDN</option>
											<option [value]="3">MNP</option>
											<option [value]="4">MY SIM</option>
											</select>
									</div>
	
	
								</div>
										</div>
								
								
										
					</div>	
					
					
					
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Start ICCID</label>
									<div class="col-md-7">											
									 <input disabled type="text" class="form-control"  formControlName="startICCID" 
								> 
									</div>
	
	
								</div>
										</div> 
								<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >End ICCID</label>
									<div class="col-md-7">
																	 											
									 <input disabled type="text" class="form-control" formControlName="endICCID" 
								> 
									</div>
	
	
								</div>
										</div> 		
										
										
					</div>	
					
					
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Test MSISDN</label>
									<div class="col-md-7">
											<input  type="text" class="form-control" 
									 formControlName="testMSISDN" autocomplete="off" >
									</div>
	
	
								</div>
										</div> 
								<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Handset Used</label>
									<div class="col-md-7">
											<input  type="text" class="form-control" 
									 formControlName="handsetUsed" autocomplete="off">
									</div>
	
	
								</div>
										</div> 		
										
										
					</div>	
					
					
					<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Product Name </label>
									<div class="col-md-7">
											<input disabled type="text" class="form-control" formControlName="Product"
									> 
									</div>
	
	
								</div>
										</div>
								<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >SIM Vendor Name</label>
									<div class="col-md-7">
																				
									 <input disabled type="text" class="form-control" formControlName="SIMVendorName"
								> 
									</div>
	
	
								</div>
										</div>			
										
										
					</div>		
				<div class="row">
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Tested & Approved By </label>
									<div class="col-md-7">
										<input  type="text" class="form-control" 
									 formControlName="testedBy" autocomplete="off">
									</div>
								</div>
							</div>		
					
							<div class="col-md-6">
													<div class="form-group row">
									<label class="col-md-5 col-form-label" >Test Status </label>
									<div class="col-md-7">
										<select class="form-control" id="product" formControlName="testStatus" required >
											<option [value]="0">Complete</option>
											<option [value]="1">In Progress</option>
											<option [value]="2">Failed</option></select>
									</div>
								</div>
							</div>		
					</div>	
					
					<div class="row">
						
										<div class="col-md-6"   *ngIf="!provisionUplodaed">
													<div class="form-group row">
								<label class="col-md-5 col-form-label">Select  Provision:</label>
								<div class="col-md-7">
                <input #fileInput type='file' id="getFile" (click)="fileInput.value = null" accept=".csv"  (change)="handleFileInput($event.target.files)">
                
				<a  class="btn btn-sm "(click)="uploadProv()">Upload</a>
	
	
								</div>
										</div>	
										</div>
										
										<div class="col-md-6"   *ngIf="provisionUplodaed">
													<div class="form-group row">
								<label class="col-md-5 col-form-label">Provision Data Already Uploaded Uploaded</label>
								</div>
							</div>	
					</div>	
            </div>
            
            	<div class="card-footer text-right" *ngIf="isAllfilesSubmitted">
					<button type="submit" [disabled]="!batchTesting.valid  && !isDisableBtn"  class="btn btn-sm btn-primary">
						<i class="fa fa-dot-circle-o"></i> Submit</button>
					
					</div>
            </form>
           </div>
          
           <div class="card-footer" *ngIf="isProceed">
          
                  <button   class="btn btn-sm btn-danger" (click)="cancel()"> Cancel</button>
           </div>
          
           </div>
           </div>
              
           
           </div>
