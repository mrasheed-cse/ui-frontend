<div class="app flex-row align-items-center">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6">
        <span style="font-family:fantasy;font-size:4.5em;color:white">
          SIM & Scratch Card Management
        </span>
            </div>

            <div class="col-md-6">
                <div class="card-group">
                    <div class="card p-4" style="opacity: 0.90;box-shadow: #888888 20px 20px 2px;">
                        <div class="card-body">
                            <h1>Verify OTP</h1>
                            <p class="text-muted">Enter the one-time password sent to your email</p>

                            <div *ngIf="successMessage" class="alert alert-success">
                                {{ successMessage }}
                            </div>

                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="icon-lock"></i></span>
                                </div>
                                <input type="text" class="form-control" placeholder="Enter OTP"
                                       [(ngModel)]="otpCode" [ngModelOptions]="{standalone: true}"
                                       (keyup.enter)="VerifyOtp()" maxlength="10">
                            </div>

                            <div class="row">
                                <div class="col-6">
                                    <button type="button" class="btn btn-primary px-4"
                                            (click)="VerifyOtp()" [disabled]="isLoading">
                                        Verify
                                    </button>
                                    <i class="fa fa-spinner fa-pulse fa-2x fa-fw ml-2" *ngIf="isLoading"></i>
                                </div>
                                <div class="col-6 text-right">
                                    <button type="button" class="btn btn-link" (click)="ResendOtp()"
                                            [disabled]="isResending || isLoading">
                                        <span *ngIf="!isResending">Resend OTP</span>
                                        <span *ngIf="isResending">
                                            <i class="fa fa-spinner fa-spin"></i> Sending...
                                        </span>
                                    </button>
                                </div>
                            </div>

                            <div *ngIf="hasError" class="mt-3">
                                <div class="alert alert-danger">
                                    {{ errorMessage }}
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-12">
                                    <a routerLink="/pages/login" class="text-muted">
                                        <i class="icon-arrow-left"></i> Back to Login
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
