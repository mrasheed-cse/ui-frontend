<div class="row">

    <div class="col-md-12">
  
      <div class="card" style="border:0px !important;background:transparent !important">
            <div style="text-align: center">
                  <i class="fa fa-spinner fa-pulse fa-3x fa-fw" *ngIf="isLoading" ></i>
            </div>
      </div>
      <div class="card">
        <div class="card-header">
          <i class="fa fa-align-justify"></i> <b>Active</b> Test SIMs assigned to myself
        </div>
        <div class="card-body" *ngIf="isDataFound">
  
          <ag-grid-angular 
            #agGrid
            style="width: 100%; height: 330px;"
            id="myGrid"
            class="ag-theme-balham"          
            [floatingFilter]="true"
            [columnTypes]="columnTypes"
            [columnDefs]="columnDefs"
            [rowData]="rowData"
            (gridReady)="onGridReady($event)"
            [rowSelection]="multiple"
            [rowMultiSelectWithClick]="true"
            >
          </ag-grid-angular>
  
          <br /><br />

          <a style="font-size:0.8em;width:140px;height:32px" class="btn btn-success" (click) = "timeExtension()" >Time Limit Extension</a>
          <a style="font-size:0.8em;width:140px;height:32px" class="btn btn-primary" (click) = "creditLimitExtension()" >Credit Limit Extension</a>

        </div>
        <div class="card-body" *ngIf="!isDataFound">
            <div class="alert alert-primary" role="alert" ><b>System found no active test SIMs</b></div>
        </div>
      </div>    
  
    </div>
  
  
  </div>
