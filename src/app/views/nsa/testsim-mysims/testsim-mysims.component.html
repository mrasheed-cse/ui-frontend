<div class="row">

  <div class="col-md-12">

    <div class="card" style="border:0px !important;background:transparent !important">
          <div style="text-align: center">
                <i class="fa fa-spinner fa-pulse fa-3x fa-fw" *ngIf="isLoading" ></i>
          </div>
    </div>
    <div class="card">
      <div class="card-header">
        <i class="fa fa-align-justify"></i> <b>Active</b> Test SIMs assigned to myself
      </div>
      <div class="card-body" *ngIf="isDataFound">

          <div style="padding-bottom: 4px;">
              <label> File Name: <input type="text" id="fileName" value="download.csv" /> </label>
              <label style="margin-left: 20px;">
                Separator <input type="text" style="width: 20px;" id="columnSeparator" value="," />
              </label>
              <label style="margin-left: 20px;"> <button (click)="onBtExport()">Export to CSV</button> </label>
            </div>
            <br />

        <ag-grid-angular 
          #agGrid
          style="width: 100%; height: 330px;"
          id="myGrid"
          class="ag-theme-balham"          
          [floatingFilter]="true"
          [columnTypes]="columnTypes"
          [columnDefs]="columnDefs"
          [rowData]="rowData"
          (gridReady)="onGridReady($event)"
          >
        </ag-grid-angular>

      </div>
      <div class="card-body" *ngIf="!isDataFound">
          <div class="alert alert-primary" role="alert" ><b>System found no active test SIMs</b></div>
      </div>
    </div>    

  </div>


</div>
