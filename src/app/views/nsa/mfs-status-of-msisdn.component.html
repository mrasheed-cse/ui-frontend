<div class="animated fadeIn">
    <div class="card">
        <div class="card-header">
            <div>
                <label>Search MFS status of an MSISDN</label>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-12">
                    <form [formGroup]="mySearchForm" novalidate (ngSubmit)="search()">
                        <div class="col-md-6 form-group row">
                            <label class="col-md-3 col-form-label" style="padding-left: 0px;">MSISDN:</label>
                            <div class="col-md-5">
                                <input type="text" class="form-control" formControlName="msisdnControl">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>
                    <br/>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div style="text-align: center">
                        <div class="div_cust_loading_sign" *ngIf="isLoading">
                            <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div>
                            <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                                <div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i
                                        class="fa fa-spinner fa-pulse fa-4x fa-fw"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="card-header">
                        <i class="fa fa-align-justify"></i> MFS status of MSISDN: <b>{{ msisdnIn }}</b>
                    </div>

                    <div class="card-body" *ngIf="isDataFound">
                        <table class="table table-bordered table-striped table-sm" style="width:60%;">
                            <tbody >
                            <tr *ngFor="let row of statusReport;  index as i">
                                <td>{{ row.title }}</td>
                                <td>{{ row.value }}</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-body" *ngIf="!isDataFound">
                        <div class="alert alert-danger" role="alert"><b>No Data Found</b></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
