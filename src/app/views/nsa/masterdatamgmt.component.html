
<div class="row">
    <div class="col-md-10">
        <div class="card">
               <div class="card-header">
                  <button type="button" class="btn btn-primary" (click)="isCollapsedNewItem = !isCollapsedNewItem"><i class="fa fa-star"></i>&nbsp; {{isCollapsedNewItem === true ? 'Click to Create New Master Data Item' : 'Create Master Data Item'}}
                  </button>
               </div>
            <div [collapse]="isCollapsedNewItem" class="card-body">
                <div class="alert alert-danger" role="alert" *ngIf="dangerAlertShow">{{dangerAlertMessage}}</div>
                <div class="alert alert-success" role="alert" *ngIf="successAlertShow">{{successAlertMessage}}</div> 
                  <form [formGroup]="createNewMasterDataForm" novalidate (ngSubmit)="onCreateNewMasterDataSubmit()">
                      <div class="col-xs-12 col-12 col-md-8 form-group">
                        <label for = "newmasterdata">Create New Item</label>
                        <input type = "text" name = "newmasterdata"  class="form-control" formControlName="newmasterdata" ><br/>  
                        <button type="submit" class="btn btn-primary">Submit</button>
                      </div>
                  </form>
            <div> 
          </div>
    </div> 
  </div>

   <!-- card div-->
<!-- col div-->

  <div class="row">
    <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                <button type="button" class="btn btn-primary" (click)="isCollapseddetailItem = !isCollapseddetailItem"><i class="fa fa-star"></i>&nbsp; {{isCollapseddetailItem === true ? 'Click to Create Detail Master Data Item' : 'Create Detail Master Data Item'}}
                </button>
            </div>
            <div [collapse]="isCollapseddetailItem" class="card-body"> 
                    <div class="alert alert-danger" role="alert" *ngIf="dangerAlertShow">{{dangerAlertMessage}}</div>
                    <div class="alert alert-success" role="alert" *ngIf="successAlertShow">{{successAlertMessage}}</div>  
                    <form [formGroup]="masterDataDetailForm" novalidate (ngSubmit)="onMasterDataDetailSubmit()">
                        <div class="col-xs-12 col-12 col-md-8 form-group">
                        <label for = "selectMasterDataItem"> Create New Detail Item</label>    
                        <select class="form-control" id="selectMasterDataItem" formControlName="selectMasterDataItem">
                        <option>select Item</option>
                        <option *ngFor="let aMasterDataItem of listMasterDataItem" [value]="aMasterDataItem.id">{{aMasterDataItem.masterDataItemName}}</option>
                        </select>
                        <label for = "newDetailItem">New Detail</label>  
                        <input type = "text" name = "newDetailItem"  class="form-control" formControlName="newDetailItem" ><br/>
                        <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                   </form>
              </div> <!-- collapse div-->
           </div> <!-- card div-->  
        </div> <!-- col div-->
</div> <!-- row div-->
