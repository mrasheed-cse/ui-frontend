<div class="recycle">
    <h5> grameenphone</h5>
    <div class="dnd-bar"></div>
      <p style="font-size: 20px; font-family: sans-serif;">MSISDN Recycle
      </p>
      
      <div class="recycle-bar"></div>
      <div id="recycle-download" class="recycle-download">
          <i class="fa fa-chevron-circle-right"   data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne" style="font-size:20px;color:#1b91c1;" aria-hidden="true"></i>
           Upload Global/Local DND List
        <div id="collapseOne" class="collapse " style="background-color:white;" aria-labelledby="headingOne" data-parent="#recycle-download">
          <div class="card-body">
            <sub>Please Select the File :</sub>   <button  class="btn btn-secondary btn-sm" onclick="document.getElementById('getFile').click()">Browser</button>
            <input #fileInput type='file' id="getFile"  (click)="fileInput.value = null"   accept=".csv" style="display:none"   (change)="handleFileInput($event.target.files)">
            <button type="button" class="btn btn-info btn-sm" style="border-radius: 10px;"(click)="dndUpload()">Upload</button>
            <p style="color:red"*ngIf="fileenable" >Please Upload a File</p>
            <p style="color:red; margin-top: 4px;"*ngIf="filestatus" >{{fileuploadstatus}}</p>
          </div>
        </div>
      </div>
    </div>
