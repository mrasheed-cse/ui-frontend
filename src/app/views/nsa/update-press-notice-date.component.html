<div class="row">
    <div class="col-md-1">

    </div>

    <div class="col-md-10">
        <div class="card">
            <div class="div_cust_loading_sign" *ngIf="isLoading || isDataLoading">
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div>
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                    <div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i
                            class="fa fa-spinner fa-pulse fa-4x fa-fw"></i></div>
                </div>
            </div>

            <div class="card-header">
                <i class="fa fa-align-justify"></i> Update Press Notice Date
            </div>

            <form [formGroup]="updatePressNoticeForm" novalidate (ngSubmit)="submit()">
                <div class="card-body">
                    <div class="row">

                        <div class="col-md-5">
                            <div class="form-group row">
                                <label class="col-md-4 col-form-label" for="listIdDropdown">Select ListId:<span style="color:red"> *</span></label>
                                <div class="col-md-8">
                                    <select id="listIdDropdown" formControlName="selectedListId" required
                                            style="margin-top: 10px; width: 100%;">
                                        <option *ngFor="let listId of listIdList" [value]="listId">{{ listId }}</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group row">
                                <label class="col-md-3 col-form-label" for="pressNoticeDate">Select Date:</label>
                                <div class="col-md-6">
                                    <input type="text" class="form-control calendar-container" id="pressNoticeDate"
                                           formControlName="pressNoticeDate" name="pressNoticeDate"  required bsDatepicker
                                           [bsConfig]="bsConfig"
                                           [maxDate]="todayDate"
                                           placement="bottom"
                                           autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-right">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="fa fa-dot-circle-o"></i> Submit
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
