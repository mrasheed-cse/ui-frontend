<div class="row">
    <div class="col-md-1">

    </div>

    <div class="col-md-10">
        <div class="card">
            <div class="div_cust_loading_sign" *ngIf="isLoading">
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div>
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                    <div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i
                            class="fa fa-spinner fa-pulse fa-4x fa-fw"></i></div>
                </div>
            </div>

            <div class="card-header">
                <i class="fa fa-align-justify"></i><span style="color: #B71C1C; font-weight: bold;"> Upload CSV File for MFS De-Tagging</span>
            </div>

            <form [formGroup]="myRecycledSmsForm" novalidate (ngSubmit)="submit()">
                <div class="card-body">
                    <div class="row">

                        <div class="col-md-4">
                            <div class="form-group row">
                                <label class="col-md-5 col-form-label" for="mfsDropdown">MFS Name<span
                                        style="color:red"> *</span></label>
                                <div class="col-md-7">
                                    <select id="mfsDropdown" formControlName="selectedMfs" required
                                            (change)="onMFSChange()" style="margin-top: 10px; width: 100%;">
                                        <option *ngFor="let mfs of mfsList" [value]="mfs.key">{{ mfs.value }}</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="form-group row">
                                <label class="col-md-3 col-form-label" for="recycledSmsFile">Upload File:</label>
                                <div class="col-md-9">
                                    <input type="file" id="recycledSmsFile" name="recycledSmsFile" class="form-control"
                                           formControlName="recycledSmsFile" required
                                           (change)="handleFileInput($event.target.files)">
                                    <div class="invalid-feedback"
                                         *ngIf="recycledSmsFile.errors && (recycledSmsFile.dirty || recycledSmsFile.touched)">
                                        <p *ngIf="recycledSmsFile.errors.required">File is required</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="card-footer text-right">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="fa fa-dot-circle-o"></i> Submit
                        </button>
                    </div>

                    <div class="row">
                        <div classs="col-md-12">
                            <a href="assets/file/De-Tagging_12-10-2024.csv" download>Download sample file</a><br/>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
