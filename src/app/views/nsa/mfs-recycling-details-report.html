<div class="row">
    <div class="col-md-1">

    </div>

    <div class="col-md-10">
        <div class="card">
            <div class="div_cust_loading_sign" *ngIf="isLoading">
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div>
                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                    <div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i
                            class="fa fa-spinner fa-pulse fa-4x fa-fw"></i></div>
                </div>
            </div>

            <div class="card-header">
                <i class="fa fa-align-justify"></i> Download MFS Recycling status report of MSISDN
            </div>

            <form [formGroup]="recycleForm" novalidate (ngSubmit)="submit()">
                <div class="card-body">
                    <div class="row">

                        <div class="col-md-8">
                            <div class="form-group row">
                                <label class="col-md-3 col-form-label" for="recycledSmsFile">Upload File:</label>
                                <div class="col-md-9">
                                    <input type="file" id="recycledSmsFile" name="recycledSmsFile" class="form-control"
                                           formControlName="recycleFile" required
                                           (change)="handleFileInput($event.target.files)">
                                    <div class="invalid-feedback"
                                         *ngIf="recycleFile.errors && (recycleFile.dirty || recycleFile.touched)">
                                        <p *ngIf="recycleFile.errors.required">File is required</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="card-footer text-right">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="fa fa-dot-circle-o"></i> Submit
                        </button>
                    </div>
                </div>
            </form>

            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div style="text-align: center">
                            <div class="div_cust_loading_sign" *ngIf="isReportLoading">
                                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div>
                                <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000">
                                    <div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i
                                            class="fa fa-spinner fa-pulse fa-4x fa-fw"></i></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-header">
                            <div class="row">
                                <div class="col-md-8">
                                    <i class="fa fa-align-justify"></i> MFS reports to download
                                </div>
                                <div class="col-md-4 d-flex justify-content-end">
                                    <button (click)="refresh()" class="btn btn-sm btn-primary">
                                        <i class="fa fa-refresh"></i> Refresh
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="card-body" *ngIf="isReportFound">
                            <table class="table table-bordered table-striped table-sm" >
                                <thead>
                                <tr>
                                    <th>File</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Details</th>
                                </tr>
                                </thead>

                                <tbody >
                                <tr *ngFor="let file of fileList;  index as i">
                                    <td>{{ file.fileName }}</td>
                                    <td>{{ file.createdAt }}</td>
                                    <td>{{ file.status }}</td>
                                    <td style="text-align:center">
                                        <button [disabled]="file.status === 'Pending'" type="button" style="width:100px" class="btn btn-success" (click)="downloadReport(file.fileName)">Download</button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-body" *ngIf="!isReportFound">
                            <div class="alert alert-danger" role="alert"><b>No files found to download</b></div>
                        </div>
                    </div>
                </div>

        </div>
    </div>
</div>
