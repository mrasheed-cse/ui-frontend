<div class="row">

  <div class="col-md-12">

    <div class="card" style="border:0px !important;background:transparent !important">
          <div style="text-align: center">
                <i class="fa fa-spinner fa-pulse fa-3x fa-fw" *ngIf="isLoading" ></i>
          </div>
    </div>
    <div class="card">
      <div class="card-header">
        <i class="fa fa-align-justify"></i> Credit Limit Extension
      </div>
      <div class="card-body" *ngIf="isDataFound">
        <table class="table table-bordered table-striped table-sm">
          <thead>
            <tr>
              <th>SL</th>
              <th>MSISDN</th>
              <th>RQN #</th>
              <th>SIM Status</th>
              <th>Assigned Credit Limit</th>
              <th>New Credit Limit</th>
              <th>Justification</th>                
            </tr>
          </thead>
          <tbody *ngFor="let aTask of requisitionList;  index as i">
                      <tr>
                          <td>{{i + 1}}</td>
                          <td>{{aTask.msisdn}}</td>
                          <td>{{aTask.requisitionNo}}</td>                          
                          <td>{{aTask.simStatus}}</td>
                          <td>{{aTask.assignedCreditLimit}}</td>
                          <td>
                              <input type="text" class="form-control" [(ngModel)] = "aTask.newCreditLimit" />
                          </td>
                          <td>
                              <input type="text" class="form-control" [(ngModel)] = "aTask.justification" />
                          </td>                                                                              
                      </tr>
          </tbody>
        </table>

        <br /><br />

        <a style="width:140px" class="btn btn-success" (click) = "submit()" >Submit</a>
        <a style="width:140px" class="btn btn-danger" (click) = "cancel()" >Cancel</a>
      </div>
      <div class="card-body" *ngIf="!isDataFound">
          <div class="alert alert-primary" role="alert" ><b>System did not find any data</b></div>
      </div>
    </div>

  </div>


</div>
