<div class="row">
	<div class="col-md-1">
		<div class="card-body"></div>
	</div>
	<div class="col-md-10">
		<div class="card">

				<div style="text-align: center">
						<div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
					</div>
			<div class="alert alert-success" role="alert" *ngIf="successAlertShow">The New Work Request <b>{{WR_Name}}</b> {{successAlertMessage}}</div>
			<div class="alert alert-danger" role="alert" *ngIf="dangerAlertShow">An Error occured to create <b>{{WR_Name}}</b> {{dangerAlertMessage}}</div>

			<div class="card-header">
				<strong>DE provisioning File Upload</strong>
			</div>

			<div class="alert alert-danger" role="alert" *ngIf="infoAlertShow"><b>{{infoAlertMessage}}</b></div>

			<form [formGroup]="myDeProvisionForm" novalidate (ngSubmit)="onDeProvisionSubmit()">
				<div class="card-body">
					<div class="row">
						<div class="col-md-6">
							<div class="form-group row">
								<label class="col-md-5 col-form-label">Work Request Name</label>
								<div class="col-md-7">
									<input disabled type="text" class="form-control calendar-container"
									value="{{WR_Name}}">
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<div class="form-group row">
								<label class="col-md-5 col-form-label" for="batchID">Batch ID</label>
								<div class="col-md-7">
									<input type="text" id="batchID" name="batchID" class="form-control" formControlName="batchID"
									 >

								</div>
							</div>
						</div>
					</div>


					<div class="row">
<!--
						<div class="col-md-6">
							<div class="form-group row">
								<label class="col-md-5 col-form-label" for="simType">Provisioning Type</label>
								<div class="col-md-7">
									<select class="form-control" id="simType" formControlName="simType" required [ngClass]="{
														'is-invalid': simType.invalid && (simType.dirty || simType.touched),
														'is-valid': simType.valid && (simType.dirty || simType.touched)
													 }">
										<option></option>
										<option *ngFor="let aSimType of listSimType" [value]="aSimType.id">{{aSimType.simTypeName}}</option>

									</select>
								</div>


								<div class="invalid-feedback" *ngIf="simType.errors && (simType.dirty || simType.touched)">
									<p *ngIf="simType.errors.required">Provisioning Type required</p>

								</div>


							</div>
						</div>
					-->
						<div class="col-md-6">
										<div class="form-group row">
										<label class="col-md-5 col-form-label" for="deProvisionFile">De Provision File</label>
										<div class="col-md-7">
											<input type="file" id="deProvisionFile" name="deProvisionFile" class="form-control" formControlName="deProvisionFile" required
											 [ngClass]="{
												'is-invalid': deProvisionFile.invalid && (deProvisionFile.dirty || deProvisionFile.touched),
												'is-valid': deProvisionFile.valid && (deProvisionFile.dirty || deProvisionFile.touched)
										   }" (change)="onFileChange($event)" >
											<div class="invalid-feedback" *ngIf="deProvisionFile.errors && (deProvisionFile.dirty || deProvisionFile.touched)">
												<p *ngIf="deProvisionFile.errors.required">De Provision File is required</p>
											</div>
										</div>
										</div>
								</div>
								<div class="col-md-6">

									</div>
					</div>

					<!-- ///
					<div class="row">
						<div class="col-md-6">

						</div>
						<div class="col-md-6">

						</div>
					</div>
					/// -->



					<div class="form-group row">
						<label class="col-md-5 col-form-label" for="cnpComment">Comment</label>
						<div class="col-md-12">
							<textarea id="cnpComment" name="cnpComment" class="form-control" formControlName="cnpComment" rows="5">
				</textarea>
						</div>
					</div>

				</div>
				<!-- <div class="card-body"> -->
				<div class="card-footer text-right">
					<button type="submit" [disabled]="isDisableBtn" class="btn btn-sm btn-primary">
						<i class="fa fa-dot-circle-o"></i> Submit</button>
					<button type="reset" class="btn btn-sm btn-danger"(click)="clearForm($event)">
						<i class="fa fa-ban"></i> Reset</button>
					<button type="button" class="btn btn-link" (click)="backButton($event)"><i class="fa fa-link" ></i>&nbsp; Back</button>

				</div>
				<!-- <div class="card-footer"> -->
			</form>

		</div>
		<!-- <div class="card"> -->
	</div>
</div>
