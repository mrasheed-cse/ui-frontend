<div class="row">

  <div class="col-md-12">

    <div class="card" style="border:0px !important;background:transparent !important">
          <div style="text-align: center">
                <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
          </div>
    </div>
    <div class="card">
      <div class="card-header">
        <i class="fa fa-align-justify"></i> Already sent activation requests
        <button style="float: right;" type="button" class="btn btn-link" ><i class="fa fa-link"></i><a [routerLink]="[ '/nsa/newsimactivationreq' ]"> Create New Activation </a></button>                
      </div>
      <div class="card-body" *ngIf="isDataFound">
        <table class="table table-bordered table-striped table-sm">
          <thead>
            <tr>
              <th>Requisition No</th>
              <th>Requisition Type</th>
              <th>Delivery Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody *ngFor="let aTask of requisitionList;  index as i">
                      <tr>
                          <td>{{aTask.requisitionNo}}</td>
                          <td>{{aTask.requisitionType}}</td>
                          <td>{{aTask.deliveryStatus}}</td>
                          <td> <button type="button" class="btn btn-link" ><i class="fa fa-link"></i>
                          <a [routerLink]="[detailsAction(aTask),aTask.id]">Details</a></button> </td>
                      </tr>
          </tbody>
        </table>
      </div>
      <div class="card-body" *ngIf="!isDataFound">
          <div class="alert alert-primary" role="alert" ><b>System found no already activation requests</b></div>
      </div>
    </div>

  </div>


</div>
