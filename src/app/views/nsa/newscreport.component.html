
<div class="card">

  <div class="card-header">

    Test SC Challan Report

      
    </div>


    <div class="card-body">
    <div class="alert alert-danger" role="alert" *ngIf="dangerAlertShow">{{dangerAlertMessage}}</div>
   
    <form [formGroup]="mySearchForm" novalidate (ngSubmit)="onSearchSubmit()">

      <div class="row">
        <div class="col-xs-12 col-12 col-md-6 form-group " >
          <label>Start Date</label>
            <input type="text" class="form-control calendar-container" id="startDate" formControlName="startDate" name="startDate"   bsDatepicker [bsConfig]="datepickerConfig"
                         placement="right" >
        </div>

        <div class="col-xs-12 col-12 col-md-6 form-group " >
           <label>End Date</label>
             <input type="text" class="form-control calendar-container" id="endDate" formControlName="endDate" name="endDate"   bsDatepicker [bsConfig]="datepickerConfig"
                         placement="left" >
        </div>
        </div>
        
        <div class="row">
            <div class="col-xs-12 col-12 col-md-6 form-group " >
              <button type="submit" class="btn btn-primary" >Submit</button>
            </div>
        </div>
                   </form>

<pre >{{mySearchForm.value | json}}</pre>
<pre *ngIf="mySearchForm.valid">This is Valid form Data.{{mySearchForm.value | json}}</pre>

<div class="card">
    <div class="card-header">
      <i class="fa fa-align-justify"></i>Test SC Challan Report
    </div>
    <div class="card-body" *ngIf="isDataFound">
      <label style="margin-left: 20px;"> <button (click)="onBtExport()">Export to CSV</button> </label>
      <ag-grid-angular 
        #agGrid
        style="width: 100%; height: 330px;"
        id="myGrid"
        class="ag-theme-balham"          
        [floatingFilter]="true"
        [columnTypes]="columnTypes"
        [columnDefs]="columnDefs"
        [rowData]="rowData"
        (gridReady)="onGridReady($event)"
        >
      </ag-grid-angular>

    </div>
    <div class="card-body" *ngIf="!isDataFound">
        <div class="alert alert-primary" role="alert" ><b></b></div>
    </div>
  </div>   

 </div>
</div>
