<div class="row">

    <div class="col-md-12">
  
      <div class="card" style="border:0px !important;background:transparent !important">
            <div style="text-align: center">
                  <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
            </div>
      </div>
      <div class="card">
        <div class="card-header">
          <i class="fa fa-align-justify"></i> Test SIM Transfer / Handover
          <button type="button" style="float: right;" class="btn btn-link" ><i class="fa fa-link"></i><a [routerLink]="[ '/nsa/testsim-transfer-new' ]"> Create New SIM Transfer Request</a></button>
        </div>
        <div class="card-body" *ngIf="isDataFound">
            <!--<div class="row">

                <div class="col-md-2">Transfer Mode
                  </div>

    <div class="col-md-6">
                  <select class="form-control"  [(ngModel)] = "transferMode">
                      <option *ngFor="let singleListItem of listTransferModes" [value]="singleListItem.id">{{singleListItem.name}}</option>
                  </select>
                </div></div> -->
                <div class="row">

                    <div class="col-md-2">Select Transferee</div>
                        <div class="col-md-6">             
                  <input type="text" (keyup)="getUserIdsFirstWay($event)" id="userIdFirstWay" list="dynmicUserIds" [(ngModel)] = "transferTo" />                  
                </div></div>
                <div class="row">

                    <div class="col-md-2">Comments
                      </div>
                      <div class="col-md-6">   
                    <input type="text" class="form-control" [(ngModel)] = "comments" />
                  </div></div>
        <br/>
        <br/>

          <table class="table table-bordered table-striped table-sm">
            <thead>
              <tr>
                <th>SL</th>
                <th>MSISDN</th>
                <th>RQN #</th>
                <th>SIM Status</th>
                <th>Test start date</th>
                <th>Test end date</th>
                <!--<th>Transfer mode</th>
                <th>Transfer to</th>
                <th>Comments</th>                -->
              </tr>
            </thead>
            <tbody *ngFor="let aTask of requisitionList;  index as i">
                        <tr>
                            <td>{{i + 1}}</td>
                            <td>{{aTask.msisdn}}</td>
                            <td>{{aTask.requisitionNo}}</td>                          
                            <td>{{aTask.simStatus}}</td>
                            <td>{{aTask.testStartDateAsString}}</td>
                            <td>{{aTask.testEndDateAsString}}</td>
                                                                                                         
                        </tr>
            </tbody>
          </table>
  
          <datalist id="dynmicUserIds">
              <option *ngFor="let item of userList1" [value]="item.userName">{{item.userName}}</option>
          </datalist>

          <br /><br />
  
          <a style="width:140px" class="btn btn-success" (click) = "submit()" >Submit</a>
          <a style="width:140px" class="btn btn-danger" (click) = "cancel()" >Cancel</a>
        </div>
        <div class="card-body" *ngIf="!isDataFound">
            <div class="alert alert-primary" role="alert" ><b>System did not find any data</b></div>
        </div>
      </div>
  
    </div>
  
  
  </div>
