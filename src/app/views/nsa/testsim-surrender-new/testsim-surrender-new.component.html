<div class="row">

    <div class="col-md-12">
  
      <div class="card" style="border:0px !important;background:transparent !important">
            <div style="text-align: center">
                  <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
            </div>
      </div>
      <div class="card">
        <div class="card-header">
          <i class="fa fa-align-justify"></i> <b>Active</b> Test SIMs assigned to myself
        </div>
        <div class="card-body" *ngIf="isDataFound">
  
          <div id="div_cst_search_params">
            MSISDN: <input type="text" [(ngModel)] = "searchOptions_msisdn" placeholder="Search by MSISDN" />
            &nbsp;&nbsp;&nbsp;RQN #: <input type="text" [(ngModel)] = "searchOptions_rqnNo" placeholder="Search by RQN #" />
            &nbsp;&nbsp;&nbsp;Sim Status: <select disabled [(ngModel)] = "searchOptions_simStatus">
              <option *ngFor="let singleListItem of listSimStatus" [value]="singleListItem.id">{{singleListItem.name}}</option>
            </select>  
            <a style="font-size:0.8em;width:140px;height:32px" class="btn btn-success" (click) = "search()" >Search</a>
            <a style="font-size:0.8em;cursor:pointer" (click) = "clearSearch()" >Clear Filters</a>
        </div>

         <ag-grid-angular 
            #agGrid
            style="width: 100%; height: 450px;"
            id="myGrid"
            class="ag-theme-balham"          
            [floatingFilter]="true"
            [columnTypes]="columnTypes"
            [columnDefs]="columnDefs"
            [rowData]="rowData"
            rowSelection="multiple"
            (gridReady)="onGridReady($event)"
            >
          </ag-grid-angular>

          <div id="div_cst_pagination_ctrls">
              <a (click)="prevPage()">&lt;&lt;</a>
              &nbsp;
              &nbsp;
              &nbsp;
              Page {{currPage}} of {{totalPages}}
              &nbsp;
              &nbsp;
              &nbsp;
              <a (click)="nextPage()">&gt;&gt;</a>              
          </div>
  
          <br /><br />

          <a style="font-size:0.8em;width:140px;height:32px" class="btn btn-success" (click) = "surrender()" >Surrender</a>

        </div>
        <div class="card-body" *ngIf="!isDataFound">
            <div class="alert alert-primary" role="alert" ><b>System found no active test SIMs</b></div>
        </div>
      </div>    
  
    </div>
  
  
  </div>
