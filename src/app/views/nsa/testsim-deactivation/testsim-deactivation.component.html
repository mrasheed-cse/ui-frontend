<div class="row">

  <div class="col-md-12">
    
    <div class="card" style="border:0px !important;background:transparent !important">
      <div style="text-align: center">
            <div class="div_cust_loading_sign" *ngIf="isLoading"> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:50000;background-color:#536c79;opacity:0.95"></div> <div style="position:fixed;width:100%;height:100%;left:0px;top:0px;z-index:60000"><div style="width:25%;height:25%;margin:0px auto;margin-top:20%"><i class="fa fa-spinner fa-pulse fa-4x fa-fw" ></i></div></div> </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header">
          <i class="fa fa-align-justify"></i> My Inactive SIMs <small>(no request yet placed for activation)</small>
        </div>
        <div class="card-body" *ngIf="isDataFound">


          <div style="padding-bottom: 4px;">
            <label> File Name: <input type="text" id="fileName" value="download.csv" /> </label>
            <label style="margin-left: 20px;">
              Separator <input type="text" style="width: 20px;" id="columnSeparator" value="," />
            </label>
            <label style="margin-left: 20px;"> <button (click)="onBtExport()">Export to CSV</button> </label>
          </div>
          <br />
            
            <ag-grid-angular 
            #agGrid
            style="width: 100%; height: 330px;"
            id="myGrid"
            class="ag-theme-balham"          
            [floatingFilter]="true"
            [columnTypes]="columnTypes"
            [columnDefs]="columnDefs"
            [rowData]="rowData"
            (gridReady)="onGridReady($event)"
            >
          </ag-grid-angular>


          <div id="div_cst_pagination_ctrls">
            <a (click)="prevPage()">&lt;&lt;</a>
            &nbsp;
            &nbsp;
            &nbsp;
            Page {{currPage}} of {{totalPages}}
            &nbsp;
            &nbsp;
            &nbsp;
            <a (click)="nextPage()">&gt;&gt;</a>              
          </div>

        </div>
        <div class="card-body" *ngIf="!isDataFound">
          <div class="alert alert-primary" role="alert" ><b>System found no data</b></div>
        </div>
    </div>

  </div>


</div>
